# Free Supabase projects pause after a week with no activity.
# This pings the database every 3 days so the app never finds it asleep.
name: Keep database awake

on:
  schedule:
    - cron: "23 14 */3 * *"   # every 3 days, 14:23 UTC (8:23 am Mountain)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "https://xsfptlfebxasxqgovktu.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_I_yxeKhncGm2NvBGS6Z40A_h_Wh9m4i" \
            -H "Content-Type: application/json" \
            -d '{}'
